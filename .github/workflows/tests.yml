name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          activate-environment: envsim
      - name: Install dependencies
        run: conda install -y openmm numpy scipy
      - name: Run self-contained tests
        run: python tests/test_pbc.py
